<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DEUTSCHMAP — German Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   DEUTSCHMAP — design tokens
   This file is organized in sections (TOKENS / LAYOUT / COMPONENTS /
   RESPONSIVE) so it can be dropped into a website as-is.
   Vocabulary data (DATA) and level config (LEVELS) live in the <script>
   below, isolated from the UI: adding a level just means adding an object.
   ========================================================================== */
:root{
  --bg: #14171c;
  --panel: #1c2028;
  --panel-2: #20242d;
  --panel-border: #2b303a;
  --ink: #f2efe6;
  --ink-dim: #9199a6;
  --red: #d1382e;
  --blue: #2f5da8;
  --yellow: #f0ab1c;
  --green: #3f9457;
  --tile-unmarked: #e8e2d3;
  --tile-unmarked-ink: #1c2028;
  --tile-review: #f0ab1c;
  --tile-review-ink: #1c1608;
  --tile-known: #3f9457;
  --tile-known-ink: #f2f7f3;
  --radius: 6px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
html,body{margin:0;padding:0;}
body{
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  min-height:100vh;
  padding-bottom: 40px;
}

/* ---------- scroll-row helper: used by level tabs, status filter, cats --- */
.scroll-row{
  display:flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  -ms-overflow-style: none;
  padding-bottom: 2px;
}
.scroll-row::-webkit-scrollbar{ display:none; }
.scroll-row > *{ flex: none; }

/* ---------- level bar (A1 / A2 / B1 ...) --------------------------------- */
.levelbar{
  background: #0e1014;
  border-bottom: 1px solid var(--panel-border);
  padding: 8px 14px;
}
.levelbar .scroll-row{ max-width: 1280px; margin: 0 auto; }
.level-pill{
  border: 1px solid var(--panel-border);
  background: var(--panel);
  color: var(--ink-dim);
  font-family:'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 12.5px;
  letter-spacing: 0.03em;
  padding: 6px 12px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
  display:flex;
  align-items:center;
  gap: 5px;
}
.level-pill.active{
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.level-pill[disabled]{
  opacity: 0.45;
  cursor: default;
}
.level-pill .soon{
  font-family:'Inter', sans-serif;
  font-weight: 500;
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  opacity: 0.8;
}

/* ---------- top bar (brand + stats) -------------------------------------- */
.topbar{
  background: rgba(28, 32, 40, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-bottom: 3px solid var(--red);
  padding: 14px 14px 12px;
  position: sticky;
  top:0;
  z-index: 20;
}
.brand-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 10px;
  max-width: 1280px;
  margin: 0 auto;
}
.brand{ display:flex; align-items:center; gap: 9px; min-width:0; }
.brand .mark{
  font-family:'Space Grotesk', sans-serif;
  font-weight:700;
  font-size: 12px;
  letter-spacing: 0.1em;
  background: var(--red);
  color: #fff;
  padding: 3px 7px;
  border-radius: 3px;
  flex: none;
}
.brand-text{ min-width:0; }
.brand h1{
  font-family:'Space Grotesk', sans-serif;
  font-size: 21px;
  font-weight: 700;
  margin: 0;
  letter-spacing: -0.01em;
  line-height: 1.1;
}
.brand .sub{
  font-family:'IBM Plex Mono', monospace;
  font-size: 10.5px;
  color: var(--ink-dim);
  letter-spacing: 0.02em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.stats{
  max-width: 1280px;
  margin: 10px auto 0;
}
.stats .scroll-row{ margin: 0 -14px; padding: 0 14px 2px; }
.stat{
  display:flex;
  align-items:center;
  gap:5px;
  padding: 5px 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--panel-border);
  font-family:'IBM Plex Mono', monospace;
  font-size: 12px;
  white-space:nowrap;
}
.dot{width:7px;height:7px;border-radius:50%;flex:none;}
.dot.known{background:var(--green);}
.dot.review{background:var(--yellow);}
.dot.unmarked{background:var(--tile-unmarked);}
.stat b{font-weight:600;color:var(--ink);}

.progressbar{
  max-width:1280px;
  margin: 10px auto 0;
  height: 5px;
  border-radius: 4px;
  overflow:hidden;
  display:flex;
  background: rgba(255,255,255,0.06);
}
.progressbar span{height:100%;display:block; transition: width .2s ease;}

/* ---------- controls: search / status filter / reset --------------------- */
.controls{
  max-width: 1280px;
  margin: 12px auto 0;
  display:flex;
  flex-wrap: wrap;
  gap: 8px;
}
.search{
  flex: 1 1 100%;
  display:flex;
  align-items:center;
  gap: 8px;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius);
  padding: 9px 11px;
}
.search svg{flex:none; opacity:0.6;}
.search input{
  background:none;
  border:none;
  outline:none;
  color: var(--ink);
  font-family:'Inter', sans-serif;
  font-size: 14px;
  width: 100%;
  min-width: 0;
}
.search input::placeholder{color: var(--ink-dim);}

.filter-row{
  flex: 1 1 100%;
  display:flex;
  gap: 8px;
  align-items:center;
}
.filter-row .scroll-row{ flex: 1 1 auto; min-width:0; }

.pill-btn{
  border: 1px solid var(--panel-border);
  background: rgba(255,255,255,0.04);
  color: var(--ink-dim);
  font-family:'Inter', sans-serif;
  font-weight: 600;
  font-size: 12.5px;
  padding: 8px 12px;
  border-radius: 999px;
  cursor:pointer;
  white-space:nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.pill-btn:hover{ color: var(--ink); }
.pill-btn.active{
  background: var(--ink);
  border-color: var(--ink);
  color: #14171c;
}

.reset-btn{
  flex: none;
  border: 1px solid var(--panel-border);
  background: rgba(209,56,46,0.12);
  color: #f0a49e;
  font-family:'Inter', sans-serif;
  font-weight:600;
  font-size: 12px;
  padding: 8px 11px;
  border-radius: var(--radius);
  cursor:pointer;
}
.reset-btn:hover{background: rgba(209,56,46,0.22);}

.cats{
  max-width: 1280px;
  margin: 10px auto 0;
}
.cat-pill{
  border: 1px solid var(--panel-border);
  background: rgba(255,255,255,0.03);
  color: var(--ink-dim);
  font-family:'Inter', sans-serif;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 11px;
  border-radius: 999px;
  cursor:pointer;
  white-space:nowrap;
}
.cat-pill:hover{ color: var(--ink); border-color:#3a4150; }
.cat-pill.active{
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}

/* ---------- content / grid ------------------------------------------------ */
.content{
  max-width: 1280px;
  margin: 16px auto 0;
  padding: 0 14px;
}
.shown-count{
  font-family:'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--ink-dim);
  margin-bottom: 10px;
}

.grid{
  display:grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.tile{
  position:relative;
  background: linear-gradient(135deg, rgba(232, 226, 211, 0.95), rgba(232, 226, 211, 0.88));
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: var(--tile-unmarked-ink);
  border-radius: var(--radius);
  padding: 10px 8px 8px;
  min-height: 70px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  cursor:pointer;
  user-select:none;
  transition: transform .1s ease, box-shadow .15s ease, background .15s ease;
  box-shadow: 0 4px 15px rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.2);
}
.tile:active{ transform: scale(0.97); }
@media (hover:hover){
  .tile:hover{ box-shadow: 0 6px 14px rgba(0,0,0,0.28); }
}

.tile.status-review{ background: var(--tile-review); color: var(--tile-review-ink); }
.tile.status-known{ background: var(--tile-known); color: var(--tile-known-ink); }

.tile .de{
  font-family:'Space Grotesk', sans-serif;
  font-weight:600;
  font-size: 13.5px;
  line-height:1.22;
  word-break: break-word;
}
.tile .en{
  font-family:'Inter', sans-serif;
  font-weight: 500;
  font-size: 11px;
  margin-top: 4px;
  opacity: 0.85;
  line-height:1.2;
  word-break: break-word;
}
.tile .en.hidden{ visibility:hidden; height:0; margin:0; }

.status-btn{
  position:absolute;
  top: 5px;
  right: 5px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  border: 1.5px solid rgba(0,0,0,0.25);
  background: rgba(255,255,255,0.35);
  cursor:pointer;
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.tile.status-known .status-btn, .tile.status-review .status-btn{
  border-color: rgba(255,255,255,0.5);
  background: rgba(0,0,0,0.15);
}
@media (hover:hover){ .status-btn:hover{ transform: scale(1.15); } }

/* Audio and action buttons on tiles */
.tile-actions{
  position:absolute;
  top: 4px;
  left: 5px;
  display:flex;
  gap: 4px;
}

.tile-action-btn{
  width: 24px;
  height: 24px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  color: rgba(0,0,0,0.8);
  font-size: 13px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition: background .15s, transform .1s;
}
.tile-action-btn:hover{
  background: rgba(255,255,255,0.4);
  transform: scale(1.1);
}
.tile-action-btn:active{
  transform: scale(0.95);
}

.empty{
  text-align:center;
  padding: 50px 20px;
  color: var(--ink-dim);
  font-family:'IBM Plex Mono', monospace;
  font-size: 13px;
}

.hint{
  max-width:1280px;
  margin: 18px auto 0;
  padding: 0 14px;
  font-family:'IBM Plex Mono', monospace;
  font-size: 10.5px;
  color: var(--ink-dim);
  line-height: 1.6;
}
.hint span{ display:block; }

/* ---------- responsive: tablet / desktop widen the grid ------------------ */
@media (min-width: 480px){
  .grid{ grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .brand h1{ font-size: 26px; }
  .brand .sub{ font-size: 11.5px; }
  .tile .de{ font-size: 14.5px; }
}
@media (min-width: 720px){
  .grid{ grid-template-columns: repeat(6, 1fr); }
  .topbar{ padding: 18px 24px 16px; }
  .content, .hint, .levelbar .scroll-row{ padding-left:24px; padding-right:24px; }
  .search{ flex: 1 1 260px; }
  .filter-row{ flex: 1 1 auto; }
}
@media (min-width: 1000px){
  .grid{ grid-template-columns: repeat(8, 1fr); }
}
</style>
</head>
<body>

<!-- ======================= LEVEL BAR (A1 / A2 / B1 / B2) ================= -->
<div class="levelbar">
  <div class="scroll-row" id="levelbar"></div>
</div>

<!-- ======================= HEADER: brand + live stats ===================== -->
<div class="topbar">
  <div class="brand-row">
    <div class="brand">
      <span class="mark" id="level-mark">A1</span>
      <div class="brand-text">
        <h1>DEUTSCHMAP</h1>
        <div class="sub" id="level-sub">German vocabulary · Goethe-Institut A1</div>
      </div>
    </div>
  </div>

  <div class="stats">
    <div class="scroll-row">
      <div class="stat"><span class="dot known"></span><b id="count-known">0</b>&nbsp;known</div>
      <div class="stat"><span class="dot review"></span><b id="count-review">0</b>&nbsp;review</div>
      <div class="stat"><span class="dot unmarked"></span><b id="count-unmarked">0</b>&nbsp;unmarked</div>
    </div>
  </div>
  <div class="progressbar" id="progressbar">
    <span id="pb-known" style="background:var(--green)"></span>
    <span id="pb-review" style="background:var(--yellow)"></span>
  </div>

  <div class="controls">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="search" type="text" placeholder="Search a word…" />
    </div>
    <div class="filter-row">
      <div class="scroll-row" id="status-filter">
        <button class="pill-btn active" data-f="all">All</button>
        <button class="pill-btn" data-f="unmarked">Unmarked</button>
        <button class="pill-btn" data-f="review">Review</button>
        <button class="pill-btn" data-f="known">Known</button>
      </div>
      <button class="reset-btn" id="reset-btn" title="Reset progress">↺</button>
      <button class="reset-btn" id="export-btn" title="Export progress as JSON">⬇</button>
      <button class="reset-btn" id="import-btn" title="Import progress from JSON">⬆</button>
      <input type="file" id="import-file" accept=".json" style="display:none;" />
    </div>
  </div>

  <div class="cats">
    <div class="scroll-row" id="cats"></div>
  </div>
</div>

<!-- ======================= CONTENT: tile grid ============================= -->
<div class="content">
  <div class="shown-count" id="shown-count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none;">No word matches your search.</div>
</div>

<div class="hint">
  <span>Tap a word to reveal its translation. Tap the circle to change its status (unmarked → review → known).</span>
  <span>Your progress is saved automatically on this device.</span>
</div>

<script>

  {id:"questions", label:"Question words"},
  {id:"prepositions", label:"Prepositions"},
];

/* ---------------------------- LEVELS config --------------------------------
   Add a level later = add an object here with the same schema
   {id, label, subtitle, available, vocab, cats}. "available:false" shows
   the level greyed out with a "Soon" badge and disables the click.        */
const LEVELS = [
  {
    id: "a1",
    label: "A1",
    subtitle: "German vocabulary · Goethe-Institut A1",
    available: true,
    vocab: VOCAB_A1,
    cats: CATS_A1,
  },
  { id: "a2", label: "A2", subtitle: "", available: false, vocab: [], cats: [] },
  { id: "b1", label: "B1", subtitle: "", available: false, vocab: [], cats: [] },
  { id: "b2", label: "B2", subtitle: "", available: false, vocab: [], cats: [] },
];

/* ---------------------------------- STATE ---------------------------------*/
let state = {
  levelId: "a1",
  status: {},       // wordId -> 'review' | 'known'
  revealed: {},     // wordId -> true (translation visible)
  query: "",
  statusFilter: "all",
  cat: "all",
};

function currentLevel(){
  return LEVELS.find(l => l.id === state.levelId) || LEVELS[0];
}
function currentVocab(){
  const lvl = currentLevel();
  // stable id per word = level + index, avoids collisions between levels
  return lvl.vocab.map((w, i) => ({ ...w, id: lvl.id + "-" + i }));
}

/* --------------------------------- STORAGE ---------------------------------
   One storage key per level: "deutschmap-progress-a1", etc.
   Uses native localStorage (persistent, per user). Fails silently if the API
   isn't available (e.g. private browsing). Supports manual export/import too.  */
function storageKey(){ return "deutschmap-progress-" + state.levelId; }

function loadProgress(){
  state.status = {};
  try{
    // Try native localStorage first
    const stored = localStorage.getItem(storageKey());
    if(stored){
      const parsed = JSON.parse(stored);
      state.status = parsed.status || {};
      console.log("Progress loaded for level", state.levelId, ":", state.status);
    }
  }catch(e){
    console.warn("Error loading progress:", e);
  }
}

let saveTimeout = null;
function saveProgress(){
  clearTimeout(saveTimeout);
  saveTimeout = setTimeout(() => {
    try{
      // Use native localStorage with fallback
      const data = JSON.stringify({status: state.status});
      localStorage.setItem(storageKey(), data);
      console.log("Progress saved for level", state.levelId);
    }catch(e){
      console.error("Save error:", e);
    }
  }, 250);
}

/* ---------------------------------- DOM refs -------------------------------*/
const levelbarEl = document.getElementById("levelbar");
const catsEl = document.getElementById("cats");
const statusFilterEl = document.getElementById("status-filter");
const gridEl = document.getElementById("grid");
const emptyEl = document.getElementById("empty");
const shownCountEl = document.getElementById("shown-count");
const searchEl = document.getElementById("search");

/* ---------------------------------- ACTIONS --------------------------------*/
function speakGerman(word){
  if(!window.speechSynthesis) return console.warn("Speech Synthesis not supported");
  
  // Cancel any ongoing speech
  window.speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(word);
  utterance.lang = "de-DE";
  utterance.rate = 0.9;
  utterance.pitch = 1.0;
  
  window.speechSynthesis.speak(utterance);
}

function cycleStatus(id){
  const cur = state.status[id];
  if(!cur) state.status[id] = "review";
  else if(cur === "review") state.status[id] = "known";
  else delete state.status[id];
  saveProgress();
  renderStats();
  renderGrid();
}

function toggleReveal(id){
  state.revealed[id] = !state.revealed[id];
  renderGrid();
}

async function switchLevel(id){
  const lvl = LEVELS.find(l => l.id === id);
  if(!lvl || !lvl.available) return;
  state.levelId = id;
  state.query = "";
  state.statusFilter = "all";
  state.cat = "all";
  state.revealed = {};
  searchEl.value = "";
  await loadProgress();
  renderLevelBar();
  renderHeaderForLevel();
  renderCats();
  renderStatusFilterActive();
  render();
}

/* ---------------------------------- FILTERING ------------------------------*/
function matchesFilters(w){
  if(state.cat !== "all" && w.cat !== state.cat) return false;
  const st = state.status[w.id] || "unmarked";
  if(state.statusFilter !== "all" && st !== state.statusFilter) return false;
  if(state.query){
    const q = state.query.toLowerCase();
    if(!w.de.toLowerCase().includes(q) && !w.en.toLowerCase().includes(q)) return false;
  }
  return true;
}

/* ---------------------------------- RENDER ---------------------------------*/
function renderLevelBar(){
  levelbarEl.innerHTML = "";
  LEVELS.forEach(lvl => {
    const btn = document.createElement("button");
    btn.className = "level-pill" + (lvl.id === state.levelId ? " active" : "");
    if(!lvl.available) btn.setAttribute("disabled", "disabled");
    btn.innerHTML = lvl.label + (!lvl.available ? '<span class="soon">Soon</span>' : "");
    btn.addEventListener("click", () => switchLevel(lvl.id));
    levelbarEl.appendChild(btn);
  });
}

function renderHeaderForLevel(){
  const lvl = currentLevel();
  document.getElementById("level-mark").textContent = lvl.label;
  document.getElementById("level-sub").textContent = lvl.subtitle;
}

function renderCats(){
  const lvl = currentLevel();
  catsEl.innerHTML = "";
  lvl.cats.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "cat-pill" + (c.id === state.cat ? " active" : "");
    btn.textContent = c.label;
    btn.addEventListener("click", () => {
      state.cat = c.id;
      renderCats();
      renderGrid();
    });
    catsEl.appendChild(btn);
  });
}

function renderStatusFilterActive(){
  statusFilterEl.querySelectorAll("button").forEach(b => {
    b.classList.toggle("active", b.getAttribute("data-f") === state.statusFilter);
  });
}

function renderStats(){
  const vocab = currentVocab();
  const known = vocab.filter(w => state.status[w.id] === "known").length;
  const review = vocab.filter(w => state.status[w.id] === "review").length;
  const total = vocab.length || 1;
  const unmarked = vocab.length - known - review;
  document.getElementById("count-known").textContent = known;
  document.getElementById("count-review").textContent = review;
  document.getElementById("count-unmarked").textContent = unmarked;
  document.getElementById("pb-known").style.width = (known/total*100) + "%";
  document.getElementById("pb-review").style.width = (review/total*100) + "%";
}

function renderGrid(){
  const vocab = currentVocab();
  const filtered = vocab.filter(matchesFilters);
  shownCountEl.textContent = filtered.length + " / " + vocab.length + " words shown";
  gridEl.innerHTML = "";
  if(filtered.length === 0){
    emptyEl.style.display = "block";
  } else {
    emptyEl.style.display = "none";
    const frag = document.createDocumentFragment();
    filtered.forEach(w => {
      const st = state.status[w.id] || "unmarked";
      const tile = document.createElement("div");
      tile.className = "tile status-" + st;
      tile.setAttribute("data-id", w.id);

      // Action buttons (audio + info)
      const actions = document.createElement("div");
      actions.className = "tile-actions";
      
      const audioBtn = document.createElement("button");
      audioBtn.className = "tile-action-btn";
      audioBtn.innerHTML = "🔊";
      audioBtn.title = "Speak German";
      audioBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        speakGerman(w.de);
      });
      
      const infoBtn = document.createElement("button");
      infoBtn.className = "tile-action-btn";
      infoBtn.innerHTML = "ℹ️";
      infoBtn.title = "Word info";
      infoBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        // Reserved for future word details modal
      });
      
      actions.appendChild(audioBtn);
      actions.appendChild(infoBtn);
      
      const de = document.createElement("div");
      de.className = "de";
      de.textContent = w.de;

      const en = document.createElement("div");
      en.className = "en" + (state.revealed[w.id] ? "" : " hidden");
      en.textContent = w.en;

      const btn = document.createElement("div");
      btn.className = "status-btn";
      btn.title = "Change status";
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        cycleStatus(w.id);
      });

      tile.appendChild(actions);
      tile.appendChild(de);
      tile.appendChild(en);
      tile.appendChild(btn);
      tile.addEventListener("click", () => toggleReveal(w.id));

      frag.appendChild(tile);
    });
    gridEl.appendChild(frag);
  }
}

function render(){
  renderStats();
  renderGrid();
}

/* --------------------------------- EVENTS -----------------------------------*/
searchEl.addEventListener("input", (e) => {
  state.query = e.target.value;
  renderGrid();
});

statusFilterEl.addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if(!btn) return;
  state.statusFilter = btn.getAttribute("data-f");
  renderStatusFilterActive();
  renderGrid();
});

document.getElementById("reset-btn").addEventListener("click", () => {
  if(!confirm("Reset progress for this level? This cannot be undone.")) return;
  state.status = {};
  try{
    localStorage.setItem(storageKey(), JSON.stringify({status: {}}));
  }catch(e){ console.error(e); }
  render();
});

// Export progress
document.getElementById("export-btn").addEventListener("click", () => {
  try{
    const data = {
      level: state.levelId,
      timestamp: new Date().toISOString(),
      status: state.status
    };
    const json = JSON.stringify(data, null, 2);
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.download = "deutschmap-backup-" + state.levelId + "-" + new Date().getTime() + ".json";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
    console.log("Progress exported for level", state.levelId);
  }catch(e){
    console.error("Export error:", e);
    alert("Error exporting progress");
  }
});

// Import progress
document.getElementById("import-btn").addEventListener("click", () => {
  document.getElementById("import-file").click();
});

document.getElementById("import-file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if(!file) return;
  
  const reader = new FileReader();
  reader.onload = (event) => {
    try{
      const content = event.target.result;
      const data = JSON.parse(content);
      
      if(!data.status){
        alert("Invalid backup file format");
        return;
      }
      
      state.status = data.status || {};
      try{
        localStorage.setItem(storageKey(), JSON.stringify({status: state.status}));
      }catch(e){ console.error(e); }
      
      render();
      alert("Progress imported successfully!");
      console.log("Progress imported for level", state.levelId, ":", state.status);
    }catch(e){
      console.error("Import error:", e);
      alert("Error importing backup file: " + e.message);
    }
  };
  reader.readAsText(file);
  
  // Reset file input
  e.target.value = "";
});

/* ---------------------------------- INIT -------------------------------------*/
function init(){
  renderLevelBar();
  renderHeaderForLevel();
  renderCats();
  renderStatusFilterActive();
  loadProgress();
  render();
}
init();
</script>
