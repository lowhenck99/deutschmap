<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>DEUTSCHMAP — Interactive German Vocabulary Grid</title>
<meta name="description" content="Learn German vocabulary from level A1 to C2 with DEUTSCHMAP. Interactive cards, German audio, and progress tracking." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #181b22;
  --panel: #222732;
  --panel-hover: #2b3240;
  --panel-border: rgba(255, 255, 255, 0.08);
  --panel-border-hover: rgba(255, 255, 255, 0.2);
  
  --ink: #f4f4f6;
  --ink-muted: #949ba8;
  --ink-dim: #5c6475;

  /* HSKMap Style Colors for States */
  --status-know-bg: rgba(52, 199, 89, 0.12);
  --status-know-border: #34C759;
  --status-know-color: #34C759;

  --status-review-bg: rgba(255, 204, 0, 0.12);
  --status-review-border: #FFCC00;
  --status-review-color: #FFCC00;

  --accent-red: #d1382e;
  --glass: rgba(24, 27, 34, 0.88);
  
  --radius-lg: 14px;
  --radius-md: 10px;
  
  --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}

*, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body { 
  margin: 0; 
  padding: 0; 
  background-color: var(--bg); 
  color: var(--ink); 
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
  min-height: 100vh; 
  padding-bottom: 60px; 
  -webkit-font-smoothing: antialiased;
}

.display-title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; letter-spacing: -0.03em; }

.scroll-row {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 4px 0;
}
.scroll-row::-webkit-scrollbar { display: none; }
.scroll-row > * { flex: none; }

/* Header */
.header-wrapper {
  background: var(--glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--panel-border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.topbar { max-width: 1280px; margin: 0 auto; padding: 16px 24px; }
.brand-row { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 16px; }

.back-btn {
  display: inline-flex;
  align-items: center;
  padding: 8px 16px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  color: var(--ink);
  text-decoration: none;
  font-size: 14px;
  font-weight: 600;
  transition: var(--transition);
}
.back-btn:hover { background: var(--panel-hover); border-color: var(--panel-border-hover); }

.brand-info { display: flex; align-items: center; gap: 12px; }
.brand-tag {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 700;
  background: var(--accent-red);
  color: #FFFFFF;
  padding: 4px 10px;
  border-radius: 6px;
}
.brand h1 { font-size: 22px; margin: 0; }
.brand .sub { font-size: 13px; color: var(--ink-muted); font-weight: 500; }

/* Statistics */
.stats-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--panel-border);
}

.stat-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-muted);
}
.dot { width: 8px; height: 8px; border-radius: 50%; }
.dot.known { background: #34C759; }
.dot.review { background: #FFCC00; }
.dot.unmarked { background: var(--ink-dim); }

.progressbar {
  flex: 1;
  height: 6px;
  border-radius: 999px;
  overflow: hidden;
  display: flex;
  background: var(--panel);
}
.progressbar span { height: 100%; transition: width 0.3s ease; }

/* Controls & Search */
.controls {
  max-width: 1280px;
  margin: 24px auto 0;
  padding: 0 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.search-box {
  display: flex;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-md);
  padding: 12px 18px;
}
.search-box input {
  background: none;
  border: none;
  outline: none;
  color: var(--ink);
  font-family: inherit;
  font-size: 15px;
  font-weight: 500;
  width: 100%;
}
.search-box input::placeholder { color: var(--ink-dim); }

.pill-btn, .level-pill {
  border: 1px solid var(--panel-border);
  background: var(--panel);
  color: var(--ink-muted);
  font-family: inherit;
  font-weight: 600;
  font-size: 13px;
  padding: 8px 18px;
  border-radius: 999px;
  cursor: pointer;
  transition: var(--transition);
}
.pill-btn:hover, .level-pill:hover { border-color: var(--panel-border-hover); color: var(--ink); }
.pill-btn.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.level-pill.active { background: var(--accent-red); border-color: var(--accent-red); color: #FFFFFF; }

/* HSKMAP Style Grid */
.content { max-width: 1280px; margin: 24px auto 0; padding: 0 24px; }
.shown-count { font-size: 13px; font-weight: 600; color: var(--ink-muted); margin-bottom: 16px; }

.tile-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

/* HSKMAP Tile Button */
.word-tile {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  border-radius: var(--radius-lg);
  padding: 16px 12px;
  min-height: 100px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  cursor: pointer;
  outline: none;
  width: 100%;
  transition: var(--transition);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
}

.word-tile:hover { 
  transform: translateY(-2px); 
  background: var(--panel-hover);
  border-color: var(--panel-border-hover);
}

.tile-de {
  font-size: calc(20px * var(--tile-font-scale, 1));
  font-weight: 700;
  color: var(--ink);
  line-height: 1.2;
  word-break: break-word;
}

.tile-en {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-muted);
  margin-top: 6px;
}
.tile-en.hidden { display: none; }

/* HSKMAP States */
.word-tile.is-know {
  background: var(--status-know-bg);
  border-color: var(--status-know-border);
}
.word-tile.is-know .tile-de { color: var(--status-know-color); }

.word-tile.is-review {
  background: var(--status-review-bg);
  border-color: var(--status-review-border);
}
.word-tile.is-review .tile-de { color: var(--status-review-color); }

/* Audio Button */
.audio-btn {
  position: absolute;
  top: 8px;
  left: 8px;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: none;
  background: rgba(0, 0, 0, 0.2);
  color: var(--ink-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: var(--transition);
}
.audio-btn:hover { color: var(--ink); background: rgba(0, 0, 0, 0.4); transform: scale(1.1); }

/* Status Indicator */
.status-indicator {
  position: absolute;
  top: 10px;
  right: 10px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  border: 2px solid var(--ink-dim);
  background: transparent;
}
.word-tile.is-know .status-indicator { background: var(--status-know-color); border-color: var(--status-know-color); }
.word-tile.is-review .status-indicator { background: var(--status-review-color); border-color: var(--status-review-color); }

@media (min-width: 550px) { .tile-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 850px) { .tile-grid { grid-template-columns: repeat(4, 1fr); } }
@media (min-width: 1100px) { .tile-grid { grid-template-columns: repeat(6, 1fr); } }
</style>
</head>
<body>

<div class="header-wrapper">
  <div class="topbar">
    <div class="brand-row">
      <div class="brand">
        <a href="index.html" class="back-btn">← Back</a>
        <div class="brand-info">
          <span class="brand-tag" id="current-level-badge">A1</span>
          <div>
            <h1 class="display-title">DEUTSCHMAP</h1>
            <div class="sub" id="level-subtitle">Official Goethe-Institut Vocabulary</div>
          </div>
        </div>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat-badge"><span class="dot known"></span><span id="count-mastered">0</span> Mastered</div>
      <div class="stat-badge"><span class="dot review"></span><span id="count-review">0</span> To Review</div>
      <div class="stat-badge"><span class="dot unmarked"></span><span id="count-tolearn">0</span> To Learn</div>
      
      <div class="progressbar">
        <span id="pb-known" style="background:#34C759"></span>
        <span id="pb-review" style="background:#FFCC00"></span>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="scroll-row" id="level-selector">
    <button class="level-pill active" data-level="a1" onclick="switchLevel('a1')">A1</button>
    <button class="level-pill" data-level="a2" onclick="switchLevel('a2')">A2</button>
    <button class="level-pill" data-level="b1" onclick="switchLevel('b1')">B1</button>
    <button class="level-pill" data-level="b2" onclick="switchLevel('b2')">B2</button>
    <button class="level-pill" data-level="c1" onclick="switchLevel('c1')">C1</button>
    <button class="level-pill" data-level="c2" onclick="switchLevel('c2')">C2</button>
  </div>

  <div class="search-box">
    <input id="search" type="text" placeholder="Search for a word (e.g., Guten Tag, Wasser...)" />
  </div>
  
  <div class="scroll-row" id="status-filter">
    <button class="pill-btn active" data-f="all">All Words</button>
    <button class="pill-btn" data-f="unmarked">To Learn</button>
    <button class="pill-btn" data-f="is-review">To Review</button>
    <button class="pill-btn" data-f="is-know">Mastered</button>
  </div>
</div>

<div class="content">
  <div class="shown-count" id="shown-count">Loading vocabulary...</div>
  <div class="tile-grid" id="grid"></div>
</div>

<script>
let VOCABULARY_DB = {};
let currentLevel = 'a1';
let state = { status: {}, revealed: {}, query: "", statusFilter: "all" };

// Dynamic font scale calculation
function calculateFontScale(text) {
  if (text.length > 18) return 0.6;
  if (text.length > 14) return 0.72;
  if (text.length > 10) return 0.85;
  return 1.0;
}

// Play audio corresponding to cleaned file name
function playWordAudio(text) {
  const cleanName = text.replace(/ /g, "_").replace(/\//g, "_").replace(/\?/g, "").replace(/!/g, "").toLowerCase();
  const audio = new Audio(`./audio/${cleanName}.mp3`);

  audio.play().catch(() => {
    speakWordFallback(text);
  });
}

function speakWordFallback(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'de-DE';
  utterance.rate = 0.85;

  const voices = window.speechSynthesis.getVoices();
  const germanVoice = voices.find(v => v.lang.startsWith('de') || v.lang.includes('DE') || v.lang.includes('de_DE'));
  if (germanVoice) utterance.voice = germanVoice;

  window.speechSynthesis.speak(utterance);
}

// Load JSON database
async function loadVocabulary() {
  try {
    const response = await fetch('vocabulary.json');
    VOCABULARY_DB = await response.json();
    
    const params = new URLSearchParams(window.location.search);
    const lvlParam = params.get('level');
    if (lvlParam && getLevelKey(lvlParam)) {
      switchLevel(lvlParam);
    } else {
      switchLevel('a1');
    }
  } catch (error) {
    document.getElementById("shown-count").textContent = "Error: Unable to load vocabulary.json file";
  }
}

function getLevelKey(lvl) {
  return Object.keys(VOCABULARY_DB).find(k => k.toLowerCase() === lvl.toLowerCase());
}

// Extraction adapted for { "word": "translation" } format
function getCurrentWords() {
  const key = getLevelKey(currentLevel);
  if (!key || !VOCABULARY_DB[key]) return [];
  
  const levelData = VOCABULARY_DB[key];
  
  if (Array.isArray(levelData.words)) {
    return levelData.words;
  }
  
  return Object.entries(levelData).map(([de, en]) => ({
    de: de,
    en: en
  }));
}

function switchLevel(lvl) {
  currentLevel = lvl;
  state.query = "";
  document.getElementById('search').value = "";
  
  const key = getLevelKey(lvl);
  if (key) {
    document.getElementById('current-level-badge').textContent = key.toUpperCase();
  }
  
  document.querySelectorAll('#level-selector .level-pill').forEach(b => {
    b.classList.toggle('active', b.getAttribute('data-level').toLowerCase() === lvl.toLowerCase());
  });

  render();
}

function cycleStatus(id, event) {
  if (event) event.stopPropagation();
  const cur = state.status[id];
  if (!cur) state.status[id] = "is-review";
  else if (cur === "is-review") state.status[id] = "is-know";
  else delete state.status[id];
  render();
}

function renderStats() {
  const words = getCurrentWords();
  const known = words.filter((w, i) => state.status[currentLevel + '-' + i] === "is-know").length;
  const review = words.filter((w, i) => state.status[currentLevel + '-' + i] === "is-review").length;
  const total = words.length || 1;
  
  document.getElementById("count-mastered").textContent = known;
  document.getElementById("count-review").textContent = review;
  document.getElementById("count-tolearn").textContent = words.length - known - review;
  document.getElementById("pb-known").style.width = (known / total * 100) + "%";
  document.getElementById("pb-review").style.width = (review / total * 100) + "%";
}

function renderGrid() {
  const words = getCurrentWords();
  const filtered = words.map((w, i) => ({ ...w, id: currentLevel + '-' + i })).filter(w => {
    const st = state.status[w.id] || "unmarked";
    if (state.statusFilter !== "all" && st !== state.statusFilter) return false;
    if (state.query && !w.de.toLowerCase().includes(state.query.toLowerCase()) && !w.en.toLowerCase().includes(state.query.toLowerCase())) return false;
    return true;
  });

  document.getElementById("shown-count").textContent = filtered.length + " of " + words.length + " words shown";
  const gridEl = document.getElementById("grid");
  gridEl.innerHTML = "";

  const frag = document.createDocumentFragment();
  filtered.forEach(w => {
    const st = state.status[w.id] || "";
    const scale = calculateFontScale(w.de);
    
    const tile = document.createElement("button");
    tile.type = "button";
    tile.className = `word-tile ${st}`;
    tile.style.setProperty('--tile-font-scale', scale);
    
    tile.innerHTML = `
      <button type="button" class="audio-btn" title="Listen" onclick="event.stopPropagation(); playWordAudio('${w.de.replace(/'/g, "\\'")}')">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
      </button>
      <div class="status-indicator" onclick="cycleStatus('${w.id}', event)"></div>
      <div class="tile-de">${w.de}</div>
      <div class="tile-en ${state.revealed[w.id] ? "" : "hidden"}">${w.en}</div>
    `;

    tile.addEventListener("click", () => {
      state.revealed[w.id] = !state.revealed[w.id];
      renderGrid();
    });

    frag.appendChild(tile);
  });
  gridEl.appendChild(frag);
}

function render() {
  renderStats();
  renderGrid();
}

document.getElementById("search").addEventListener("input", (e) => {
  state.query = e.target.value;
  renderGrid();
});

document.getElementById("status-filter").addEventListener("click", (e) => {
  const btn = e.target.closest("button");
  if (!btn) return;
  state.statusFilter = btn.getAttribute("data-f");
  document.querySelectorAll("#status-filter button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderGrid();
});

window.addEventListener("DOMContentLoaded", () => {
  loadVocabulary();
});
</script>
</body>
</html>
